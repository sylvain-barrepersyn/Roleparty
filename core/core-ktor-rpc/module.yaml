product: jvm/lib

apply:
  - //[module-templates]/ktor-server.module-template.yaml
  - //[module-templates]/serialization-configuration.module-template.yaml

settings:
  kotlin:
    rpc: enabled

dependencies:
  - $kotlin.rpc.krpc.ktor.server: exported
  - $kotlin.rpc.krpc.ktor.client: exported
  - $kotlin.rpc.krpc.serialization.json
  - $ktor.client.cio

test-dependencies:
  - $ktor.server.netty
