product: jvm/lib

apply:
  - //[module-templates]/compose-project.module-template.yaml

settings:
  compose:
    resources:
      packageName: app.roleparty.core.frontend.container.resources

dependencies:
  - //core/core-designsystem: exported
  - //core/core-ktor-client: exported
  - $libs.lifecycle.viewmodel.compose: exported
  - $libs.lifecycle.viewmodel.navigation3: exported
  - $libs.navigation3.ui: exported
  - $libs.koin.compose.viewmodel: exported
  - $kotlin.reflect

test-dependencies:
  - //core/core-test
  - $compose.desktop.currentOs
  - $compose.uiTest
  - $libs.kotlinx.coroutines.test
