include required("/stdlib/jdk/25/openjdk.conf")

skiko {
  version = ${env.SKIKO_VERSION}
  repository = "https://repo1.maven.org/maven2/org/jetbrains/skiko"
}

webrtc {
  version = ${env.WEBRTC_JAVA_VERSION}
  repository = "https://repo1.maven.org/maven2/dev/onvoid/webrtc/webrtc-java"
}

app {
  display-name = Roleparty
  fsname = roleparty
  rdns-name = app.roleparty
  vendor = Roleparty
  description = "Desktop TTRPG application for campaign management"
  license = MIT
  vcs-url = "github.com/sylvain-barrepersyn/Roleparty"

  version = 0.0.0
  version = ${?env.ROLEPARTY_VERSION}

  icons = "application/application-frontend/icons/roleparty.svg"
  mac.icons = "application/application-frontend/icons/roleparty-mac.svg"

  updates = aggressive
  machines = [windows.amd64, mac.amd64, mac.aarch64, linux.amd64.glibc]

  inputs += "build/conveyor/lib/*.jar"
  windows.amd64.inputs += ${skiko.repository}/skiko-awt-runtime-windows-x64/${skiko.version}/skiko-awt-runtime-windows-x64-${skiko.version}.jar
  mac.amd64.inputs += ${skiko.repository}/skiko-awt-runtime-macos-x64/${skiko.version}/skiko-awt-runtime-macos-x64-${skiko.version}.jar
  mac.aarch64.inputs += ${skiko.repository}/skiko-awt-runtime-macos-arm64/${skiko.version}/skiko-awt-runtime-macos-arm64-${skiko.version}.jar
  linux.amd64.inputs += ${skiko.repository}/skiko-awt-runtime-linux-x64/${skiko.version}/skiko-awt-runtime-linux-x64-${skiko.version}.jar

  windows.amd64.inputs += ${webrtc.repository}/${webrtc.version}/webrtc-java-${webrtc.version}-windows-x86_64.jar
  mac.amd64.inputs += ${webrtc.repository}/${webrtc.version}/webrtc-java-${webrtc.version}-macos-x86_64.jar
  mac.aarch64.inputs += ${webrtc.repository}/${webrtc.version}/webrtc-java-${webrtc.version}-macos-aarch64.jar
  linux.amd64.inputs += ${webrtc.repository}/${webrtc.version}/webrtc-java-${webrtc.version}-linux-x86_64.jar

  linux.debian.control.Depends = [libpulse0]

  mac {
    info-plist {
      NSCameraUsageDescription = "Roleparty shows your camera to the people at the tabletop when you turn it on."
      NSMicrophoneUsageDescription = "Roleparty lets the people at the tabletop hear you when you turn your microphone on."
    }
    entitlements-plist {
      "com.apple.security.device.camera" = true
      "com.apple.security.device.audio-input" = true
    }
  }

  jvm {
    gui.main-class = app.roleparty.application.frontend.MainKt
    system-properties {
      "roleparty.backend.url" = "https://api.roleparty.app"
    }
  }

  site.github {
    oauth-token = only-set-in-the-pipeline
    oauth-token = ${?env.GITHUB_TOKEN}
    pages-branch = gh-pages
  }
}

conveyor.compatibility-level = 22
