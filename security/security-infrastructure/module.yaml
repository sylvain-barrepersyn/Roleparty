product: jvm/lib

apply:
  - //[module-templates]/ktor-server.module-template.yaml
  - //[module-templates]/serialization-configuration.module-template.yaml

settings:
  kotlin:
    rpc: enabled

dependencies:
  - //account/account-contract-internal
  - //account/account-event
  - //core/core-ktor-rest
  - //core/core-ktor-rpc
  - //core/core-rabbitmq
  - //core/core-security: exported
  - //security/security-contract-web
  - //security/security-database
  - //security/security-domain: exported
  - $ktor.server.rateLimit
  - $libs.kotlinx.html

test-dependencies:
  - //security/security-test
  - $libs.testcontainers.postgresql
  - $ktor.server.netty
