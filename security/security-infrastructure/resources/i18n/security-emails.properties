verification.subject=Confirm your Roleparty email address
verification.title=Welcome to Roleparty!
verification.body=Enter this code in Roleparty to confirm your email address. It is valid for one hour.
verification.ignore=If you did not create an account, you can ignore this email: nobody can use your address without this code.
already-registered.subject=Someone tried to create a Roleparty account with your address
already-registered.title=You already have an account
already-registered.body=Someone tried to create a Roleparty account with this email address, which already has one. If it was you, sign in or reset your password from Roleparty.
already-registered.ignore=If it was not you, you can ignore this email: your account has not changed.
password-reset.subject=Reset your Roleparty password
password-reset.title=Reset your password
password-reset.body=Enter this code in Roleparty to choose a new password. It is valid for 15 minutes.
password-reset.ignore=If you did not ask for this, you can ignore this email: your password has not changed.
