verification.subject=Confirmez votre adresse e-mail Roleparty
verification.title=Bienvenue sur Roleparty !
verification.body=Saisissez ce code dans Roleparty pour confirmer votre adresse e-mail. Il est valable une heure.
verification.ignore=Si vous n’avez pas créé de compte, vous pouvez ignorer cet e-mail : personne ne peut utiliser votre adresse sans ce code.
already-registered.subject=Quelqu’un a essayé de créer un compte Roleparty avec votre adresse
already-registered.title=Vous avez déjà un compte
already-registered.body=Quelqu’un a essayé de créer un compte Roleparty avec cette adresse e-mail, qui en possède déjà un. Si c’était vous, connectez-vous ou réinitialisez votre mot de passe depuis Roleparty.
already-registered.ignore=Si ce n’était pas vous, vous pouvez ignorer cet e-mail : votre compte n’a pas changé.
password-reset.subject=Réinitialisez votre mot de passe Roleparty
password-reset.title=Réinitialisez votre mot de passe
password-reset.body=Saisissez ce code dans Roleparty pour choisir un nouveau mot de passe. Il est valable 15 minutes.
password-reset.ignore=Si vous n’êtes pas à l’origine de cette demande, vous pouvez ignorer cet e-mail : votre mot de passe n’a pas changé.
