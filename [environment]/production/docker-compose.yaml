name: roleparty

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=roleparty_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=ERROR"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - public
    restart: unless-stopped

  backend:
    image: ghcr.io/sylvain-barrepersyn/roleparty-backend:${ROLEPARTY_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - public
      - internal
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE_NAME: ${POSTGRES_DATABASE_NAME}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      ACCOUNT_RPC_URL: ws://localhost:8080/rpc/account
      ACCOUNT_RPC_TOKEN_FILE: /run/secrets/account_rpc_token
      MEDIA_RPC_TOKEN_FILE: /run/secrets/media_rpc_token
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN}
      HOSTINGER_MAILBOX_ID: ${HOSTINGER_MAILBOX_ID}
      ALERT_EMAIL_ADDRESS: ${ALERT_EMAIL_ADDRESS:-}
      TRUST_PROXY: "true"
    secrets:
      - jwt_private_key
      - jwt_public_key
      - account_rpc_token
      - media_rpc_token
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/localhost/8080" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
    volumes:
      - "postgres:/var/lib/postgresql"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - "rabbitmq:/var/lib/rabbitmq"
    networks:
      - internal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${MONITOR_HOST}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dozzle.middlewares=dozzle-auth"
      - "traefik.http.middlewares.dozzle-auth.basicauth.users=${MONITOR_USERS}"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    restart: unless-stopped

secrets:
  jwt_private_key:
    file: ./secrets/jwt-private.pem
  jwt_public_key:
    file: ./secrets/jwt-public.pem
  account_rpc_token:
    file: ./secrets/account-rpc-token.txt
  media_rpc_token:
    file: ./secrets/media-rpc-token.txt

volumes:
  letsencrypt:
  postgres:
  rabbitmq:

networks:
  public:
  internal:
