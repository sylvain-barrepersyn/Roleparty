product: jvm/lib

apply:
  - //[module-templates]/ktor-server.module-template.yaml
  - //[module-templates]/serialization-configuration.module-template.yaml

settings:
  kotlin:
    rpc: enabled
    serialization:
      format: json

dependencies:
  - //account/account-domain: exported
  - //account/account-contract-rpc
  - //account/account-database
  - //account/account-event
  - //core/core-krpc
  - //core/core-outbox: exported

test-dependencies:
  - //account/account-test
  - $libs.testcontainers.postgresql
  - $libs.testcontainers.rabbitmq
