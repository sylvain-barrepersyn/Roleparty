name: Set up the Kotlin toolchain
description: Installs JDK 25 and restores the Kotlin toolchain and dependency caches

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/JetBrains
          ~/.m2/repository
        key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml') }}
        restore-keys: kotlin-${{ runner.os }}-
