name: Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: pipeline-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/sylvain-barrepersyn/roleparty-backend

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install the libraries of the WebRTC native library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libudev1 libx11-6 libxext6 libxfixes3 libxdamage1 libxtst6 libxrandr2 libxcomposite1 \
            libdbus-1-3 libglib2.0-0 libgbm1 libdrm2
      - run: ./kotlin build
      - run: ./kotlin test

  version:
    name: Tag the version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
      release: ${{ steps.next.outputs.bump == 'major' || steps.next.outputs.bump == 'minor' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
      - if: steps.next.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

  backend:
    name: Deploy the backend
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./kotlin package -m application-backend -f executable-jar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: build/tasks/_application-backend_executableJarJvm
          file: application/application-backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.VERSION }}
            ${{ env.BACKEND_IMAGE }}:latest

      - if: env.TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          options=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes)

          scp "${options[@]}" -P "$DEPLOY_PORT" \
            '[environment]/production/docker-compose.yaml' \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yaml"

          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' \
              && docker login ghcr.io -u '$REGISTRY_USER' --password-stdin \
              && export ROLEPARTY_VERSION='$VERSION' \
              && docker compose pull backend \
              && docker compose up -d --wait --wait-timeout 600 --remove-orphans; \
            status=\$?; docker logout ghcr.io; exit \$status" <<<"$REGISTRY_TOKEN"

  desktop:
    name: Release the desktop application
    needs: [version, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: .github/scripts/prepare-conveyor-inputs.sh | grep -E '^(SKIKO|WEBRTC_JAVA)_VERSION=' >> "$GITHUB_ENV"
      - uses: hydraulic-software/conveyor/actions/build@v22.4
        env:
          ROLEPARTY_VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: make copied-site
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1
